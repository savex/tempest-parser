[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "TempestParser"
# from the nearest v* git tag (setuptools-scm); untagged commits get a .devN version
dynamic = ["version"]
description = "Builds trending HTML and CSV reports from Tempest, pytest, Rally, k8s conformance and subunit test results."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alex Savatieiev", email = "a.savex@gmail.com" }]
keywords = ["QA", "tempest", "openstack", "kubernetes", "pytest", "subunit", "html", "report"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jinja2>=3.1",
    "markupsafe>=2.1",
    "python-subunit>=1.4",
    "testtools>=2.5",
]

[project.urls]
Homepage = "https://github.com/savex/tempest-parser"
Changelog = "https://github.com/savex/tempest-parser/blob/master/changelog.md"
Issues = "https://github.com/savex/tempest-parser/issues"

[project.scripts]
tparser = "tempest_parser.tparser:tempest_cli_parser_main"

# Development tools, installed by `uv sync` (all groups) or `pip install --group <name>`.
[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=6",
    "coverage>=7.10",
    # the integration tests build the wheel without build isolation and install it with pip
    "build>=1.2",
    "pip>=25",
    "setuptools>=77",
    "setuptools-scm>=8",
]
# shellcheck-py: actionlint runs shellcheck on workflow scripts when it is on PATH, as on GitHub
lint = ["ruff>=0.12", "actionlint-py>=1.7", "shellcheck-py>=0.10", "mypy>=1.15"]
release = ["build>=1.2", "twine>=6"]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "release" }]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.packages.find]
# etc/, res/ and templates/ hold data files only; finding them as namespace packages keeps
# setuptools from warning that they are importable but not packaged
include = ["tempest_parser", "tempest_parser.*"]
namespaces = true

[tool.setuptools.package-data]
# py.typed: the package's annotations are for other code to use (PEP 561)
"*" = ["*.conf", "*.list", "*.html", "py.typed"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: quick end-to-end checks of the tparser command (tests/smoke)",
    "functional: one module or class at a time (tests/functional)",
    "integration: the built and installed package (tests/integration)",
]
filterwarnings = [
    # TestsManager is a production class whose name starts with "Test"
    "ignore:cannot collect test class 'TestsManager':pytest.PytestCollectionWarning",
]

[tool.coverage.run]
source = ["tempest_parser"]
branch = true
# the smoke tests run tparser in subprocesses; measure those too
patch = ["subprocess"]

[tool.coverage.report]
# smoke and functional tests together (CI: `coverage report` after both); raise it as tests are added
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
files = ["tempest_parser"]
python_version = "3.11"
# every function is annotated; strict also checks generics, Any returns and unused ignores
strict = true

[[tool.mypy.overrides]]
# no type information published
module = ["subunit", "subunit.*", "testtools", "testtools.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I", "B", "SIM"]
