# Automatic: tracks the version on every push to master.
# Fails if changelog.md is behind the latest release tag; reports what the next releases would be.
name: Version tracking

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changelog.md against tags
        run: scripts/version.sh check

      - name: Report
        run: |
          current=$(scripts/version.sh current)
          tag=$(scripts/version.sh latest-tag)
          since="n/a"
          [[ -n $tag ]] && since=$(git rev-list --count "$tag..HEAD")
          {
            echo "### Version"
            echo "| | |"
            echo "|---|---|"
            echo "| This commit | \`$current\` |"
            echo "| Latest release tag (highest) | \`${tag:-none}\` |"
            echo "| changelog.md | \`$(scripts/version.sh changelog-version)\` |"
            echo "| Commits since release | $since |"
            echo "| Next patch / minor / major | \`$(scripts/version.sh next patch)\` / \`$(scripts/version.sh next minor)\` / \`$(scripts/version.sh next major)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! report=$(scripts/version.sh versions); then
            while IFS= read -r line; do
              [[ $line == "out of sync:"* ]] && echo "::warning title=Versions out of sync::${line#out of sync: }"
            done <<< "$report"
            echo "Bump version continues from the highest: $(scripts/version.sh highest)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "$current" > version.txt

      - uses: actions/upload-artifact@v7
        with:
          name: version
          path: version.txt
