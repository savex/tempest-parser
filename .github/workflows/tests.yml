# Automatic on pull requests and pushes to master; also manual.
# Lint, package and version checks, then the tests by tag: smoke first, then functional,
# and integration against the built wheel.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating systems for the test matrix"
        type: choice
        options: [all, ubuntu, macos]
        default: all

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  lint:
    name: Lint, package, version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check --output-format=github .
      - name: actionlint
        run: uv run actionlint
      - name: Build and check the package
        run: |
          uv build --out-dir dist
          uv run twine check --strict dist/*
      - name: Version consistency
        run: |
          scripts/version.sh check
          scripts/version.sh versions || echo "::warning::latest tag and changelog.md versions differ (see above)"
      - name: Every test has one tag (smoke / functional / integration)
        run: uv run python scripts/check-test-tags.py

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.os == 'all') && '["ubuntu-latest","macos-latest"]' || format('["{0}-latest"]', inputs.os)) }}
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --python "${{ matrix.python }}"
      - name: Smoke tests
        run: uv run pytest -m smoke --junitxml=junit-smoke.xml
      - name: Functional tests
        run: uv run pytest -m functional --junitxml=junit-functional.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: junit-*.xml

  integration:
    name: Integration (built wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies, not the project (the test builds and installs the wheel)
        run: uv sync --locked --no-install-project
      - name: Integration tests
        run: uv run --no-sync pytest -m integration --junitxml=junit-integration.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-integration
          path: junit-integration.xml
