# Automatic on pull requests and pushes to master; also manual.
# Lint, package and version checks, then the tests by tag: smoke first, then functional,
# and integration against the built wheel.
name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: "Operating systems for the test matrix"
        type: choice
        options: [all, ubuntu, macos]
        default: all

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint, package, version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: "*requirements.txt"
      - name: Install
        run: pip install -r requirements.txt -r test-requirements.txt -e .
      - name: Ruff
        run: ruff check --output-format=github .
      - name: Build and check the package
        run: |
          python -m build --outdir dist .
          twine check --strict dist/*
      - name: Version consistency
        run: |
          scripts/version.sh check
          scripts/version.sh versions || echo "::warning::tag, setup.py and changelog.md versions differ (see above)"
      - name: Every test has one tag (smoke / functional / integration)
        run: python scripts/check-test-tags.py

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.os == 'all') && '["ubuntu-latest","macos-latest"]' || format('["{0}-latest"]', inputs.os)) }}
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: "*requirements.txt"
      - name: Install
        run: pip install -r requirements.txt -r test-requirements.txt -e .
      - name: Smoke tests
        run: pytest -m smoke --junitxml=junit-smoke.xml
      - name: Functional tests
        run: pytest -m functional --junitxml=junit-functional.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: junit-*.xml

  integration:
    name: Integration (built wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: "*requirements.txt"
      - name: Install
        run: pip install -r requirements.txt -r test-requirements.txt
      - name: Integration tests
        run: pytest -m integration --junitxml=junit-integration.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: junit-integration
          path: junit-integration.xml
